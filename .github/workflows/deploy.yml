name: Build and Deploy (Web & Android)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1. SET UP PYTHON & PYGBAG ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pygbag and Pygame
        run: |
          python -m pip install --upgrade pip
          pip install pygame pygbag

      - name: Build Web Game with Pygbag
        run: |
          # Pygbag compiles main.py and packs assets into build/web/
          python -m pygbag --build --disable-sound-format-error main.py

      # --- 2. DEPLOY TO GITHUB PAGES ---
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean: true

      # --- 3. SET UP JAVA & NODE FOR ANDROID BUILD ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- 4. BUILD ANDROID APK WITH CAPACITOR ---
      - name: Initialize and Build Android App
        run: |
          # Create package.json and install Capacitor dependencies
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
          # Initialize Capacitor with the Pygbag build directory
          npx cap init "Forest Flapper Arcade" "com.saisaran.flapperarcade" --web-dir=build/web
          
          # Configure Capacitor to load the game remotely to bypass CORS/Loader hang
          # and also support auto-updates on mobile
          python -c "import json; f=open('capacitor.config.json','r'); d=json.load(f); d['server']={'url':'https://saisaran-m.github.io/flapper-arcade/','allowNavigation':['saisaran-m.github.io']}; f=open('capacitor.config.json','w'); json.dump(d,f,indent=2)"
          
          # Add the Android platform
          npx cap add android
          
          # Generate launcher icons and splash screens using the updated logo assets
          npx capacitor-assets generate --android
          
          # Exclude conflicting kotlin versions in build.gradle
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle
          
          # Sync web files into the Android project
          npx cap sync
          
          # Make gradlew executable
          chmod +x android/gradlew
          
          # Build the debug APK
          cd android
          ./gradlew assembleDebug

      # --- 5. UPLOAD APK AS ARTIFACT ---
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forest-Flapper-Arcade-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # --- 6. CREATE LATEST RELEASE ---
      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: latest
          name: "Latest Android Build"
          body: "This release contains the latest Android APK for Forest Flapper Arcade. Download the APK file below to install on your phone!"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
